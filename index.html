<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evergreen Hills Christmas Tree Farm Light Show | Holland, NY</title>
    <meta name="description" content="Evergreen Hills Christmas Tree Farm Light Show in Holland, NY. Tune to 88.1 FM nightly from Nov 27, 2026 to Jan 1, 2027, 5:00 PM - 9:30 PM.">
    <style>
        :root {
            --bg-dark: #0b1612;
            --sidebar-bg: #08100d;
            --card-bg: #13241e;
            --accent-gold: #f5b041;
            --accent-red: #d9383a;
            --accent-green: #2ecc71;
            --text-light: #f4f7f5;
            --text-muted: #b8c7c1;
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .lights-bar {
            height: 6px;
            background: repeating-linear-gradient(
                90deg,
                var(--accent-red) 0px,
                var(--accent-red) 20px,
                var(--accent-gold) 20px,
                var(--accent-gold) 40px,
                var(--accent-green) 40px,
                var(--accent-green) 60px
            );
        }

        .sidebar-header {
            padding: 1.75rem 1.25rem 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-header h2 {
            font-size: 1.15rem;
            color: #ffffff;
            line-height: 1.3;
        }

        .sidebar-header span {
            display: inline-block;
            margin-top: 0.4rem;
            font-size: 0.8rem;
            color: var(--accent-gold);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            padding: 1rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            flex-grow: 1;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            text-align: left;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .nav-btn.active {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid rgba(245, 176, 65, 0.3);
        }

        .sidebar-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border-subtle);
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .fm-pill {
            display: block;
            background-color: var(--accent-red);
            color: #ffffff;
            text-align: center;
            font-weight: 800;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        /* Main Content Area */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        header {
            padding: 2.5rem 2rem 2rem;
            background: radial-gradient(circle at top left, #1b362d 0%, var(--bg-dark) 75%);
            border-bottom: 1px solid var(--border-subtle);
        }

        .badge {
            display: inline-block;
            background-color: rgba(245, 176, 65, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 0.3rem 0.85rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        h1 {
            font-size: 2.1rem;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 650px;
        }

        .content-area {
            padding: 2rem;
            max-width: 960px;
            width: 100%;
            flex-grow: 1;
        }

        /* Tab Panels */
        .tab-panel {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
        }

        .card h3 {
            color: var(--accent-gold);
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
        }

        .card p {
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }

        .card strong {
            color: var(--text-light);
        }

        .status-banner {
            background-color: rgba(46, 204, 113, 0.12);
            border: 1px solid rgba(46, 204, 113, 0.4);
            border-radius: 12px;
            padding: 1.1rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent-green);
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-green);
            color: #07120e;
            text-decoration: none;
            font-weight: 700;
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .tips-list {
            list-style: none;
            margin-top: 0.5rem;
        }

        .tips-list li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.65rem;
            color: var(--text-muted);
        }

        .tips-list li::before {
            content: "❄";
            position: absolute;
            left: 0;
            color: var(--accent-gold);
        }

        /* Sub-Tabs for Past Shows */
        .sub-tabs {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .sub-tab-btn {
            background-color: var(--sidebar-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sub-tab-btn:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
        }

        .sub-tab-btn.active {
            background-color: var(--accent-gold);
            color: #0b1612;
            border-color: var(--accent-gold);
        }

        .sub-panel {
            display: none;
        }

        .sub-panel.active {
            display: block;
        }

        /* Responsive YouTube Video Wrapper */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #000000;
            margin-top: 1rem;
            border: 1px solid var(--border-subtle);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .shorts-wrapper {
            max-width: 360px;
            margin: 1rem auto 0;
        }

        .shorts-aspect {
            position: relative;
            padding-bottom: 177.77%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background-color: #000000;
            border: 1px solid var(--border-subtle);
        }

        .shorts-aspect iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--accent-gold);
